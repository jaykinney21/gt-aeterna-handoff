<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kobe Mamba Mentality - 3D Vessel Preview</title>
    <style>
        body { margin: 0; background: #1a1a2e; font-family: Arial, sans-serif; overflow: hidden; }
        #info { 
            position: absolute; top: 10px; left: 10px; color: #e0e0e0; 
            background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px;
            font-size: 14px; z-index: 100;
        }
        #info h2 { margin: 0 0 8px; color: #C9A962; font-size: 18px; }
        #info p { margin: 4px 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="info">
        <h2>🏀 Kobe "Mamba Mentality" Vessel</h2>
        <p>446,532 faces • 122,462 vertices</p>
        <p>Generated by Hunyuan3D-2 in 8.8s</p>
        <p style="color: #888; margin-top: 8px;">Drag to rotate • Scroll to zoom</p>
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight1.position.set(5, 5, 5);
        scene.add(dirLight1);
        
        const dirLight2 = new THREE.DirectionalLight(0xC9A962, 0.5);
        dirLight2.position.set(-5, 3, -5);
        scene.add(dirLight2);

        const dirLight3 = new THREE.DirectionalLight(0x9CAF88, 0.3);
        dirLight3.position.set(0, -3, 5);
        scene.add(dirLight3);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2.0;

        // Load model
        const loader = new GLTFLoader();
        loader.load('kobe-mamba-mentality.glb', (gltf) => {
            const model = gltf.scene;
            
            // Center and scale
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 2 / maxDim;
            
            model.position.sub(center);
            model.scale.setScalar(scale);
            
            // Apply material
            model.traverse((child) => {
                if (child.isMesh) {
                    child.material = new THREE.MeshStandardMaterial({
                        color: 0xC9A962,
                        metalness: 0.3,
                        roughness: 0.4,
                    });
                }
            });
            
            scene.add(model);
        });

        // Grid
        const grid = new THREE.GridHelper(10, 20, 0x333366, 0x222244);
        scene.add(grid);

        // Animate
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
