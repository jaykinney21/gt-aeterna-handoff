<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kobe Mamba Mentality - 3D Vessel Preview</title>
    <style>
        body { margin: 0; background: #1a1a2e; font-family: Arial, sans-serif; overflow: hidden; }
        #info { 
            position: absolute; top: 10px; left: 10px; color: #e0e0e0; 
            background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px;
            font-size: 14px; z-index: 100; max-width: 300px;
        }
        #info h2 { margin: 0 0 8px; color: #C9A962; font-size: 18px; }
        #info p { margin: 4px 0; }
        .controls { margin-top: 12px; }
        button { 
            background: #C9A962; color: #1a1a2e; border: none; padding: 8px 16px; 
            border-radius: 4px; cursor: pointer; font-weight: bold; margin: 4px 4px 4px 0;
            font-size: 13px;
        }
        button:hover { background: #d4b872; }
        button.active { background: #9CAF88; color: white; }
        canvas { display: block; }
        #stats { color: #888; font-size: 12px; margin-top: 8px; }
    </style>
</head>
<body>
    <div id="info">
        <h2>🏀 Kobe "Mamba Mentality" Vessel</h2>
        <p>446,532 faces • 122,462 vertices</p>
        <p>Generated by Hunyuan3D-2 in 8.8s</p>
        <p style="color: #888; margin-top: 4px;">Drag to rotate • Scroll to zoom</p>
        <div class="controls">
            <button id="btnSolid" class="active" onclick="setMode('solid')">Solid</button>
            <button id="btnWire" onclick="setMode('wireframe')">Wireframe</button>
            <button id="btnBoth" onclick="setMode('both')">Solid + Wire</button>
            <button id="btnFlat" onclick="setMode('flat')">Flat Shaded</button>
        </div>
        <div class="controls">
            <button id="btnBrass" class="active" onclick="setMaterial('brass')">Brass</button>
            <button id="btnWhite" onclick="setMaterial('white')">White Resin</button>
            <button id="btnNylon" onclick="setMaterial('nylon')">Nylon</button>
            <button id="btnClay" onclick="setMaterial('clay')">Clay</button>
        </div>
        <div id="stats"></div>
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight1.position.set(5, 5, 5);
        scene.add(dirLight1);
        
        const dirLight2 = new THREE.DirectionalLight(0xC9A962, 0.5);
        dirLight2.position.set(-5, 3, -5);
        scene.add(dirLight2);

        const dirLight3 = new THREE.DirectionalLight(0x9CAF88, 0.3);
        dirLight3.position.set(0, -3, 5);
        scene.add(dirLight3);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2.0;

        // Materials
        const materials = {
            brass: new THREE.MeshStandardMaterial({ color: 0xC9A962, metalness: 0.4, roughness: 0.3 }),
            white: new THREE.MeshStandardMaterial({ color: 0xf0f0f0, metalness: 0.0, roughness: 0.6 }),
            nylon: new THREE.MeshStandardMaterial({ color: 0xd0d0d0, metalness: 0.0, roughness: 0.8 }),
            clay: new THREE.MeshStandardMaterial({ color: 0xD9A384, metalness: 0.0, roughness: 0.9 }),
        };

        const wireframeMat = new THREE.MeshBasicMaterial({ 
            color: 0x00ff88, wireframe: true, transparent: true, opacity: 0.3 
        });

        const flatMat = new THREE.MeshPhongMaterial({ 
            color: 0xC9A962, flatShading: true, shininess: 30 
        });

        let model = null;
        let wireframeModel = null;
        let currentMode = 'solid';
        let currentMaterial = 'brass';

        // Load model
        const loader = new GLTFLoader();
        loader.load('./kobe-mamba-mentality.glb', (gltf) => {
            model = gltf.scene;
            
            // Center and scale
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 2 / maxDim;
            
            model.position.sub(center);
            model.scale.setScalar(scale);
            
            // Apply default material
            model.traverse((child) => {
                if (child.isMesh) {
                    child.material = materials.brass.clone();
                }
            });
            
            scene.add(model);

            // Create wireframe clone
            wireframeModel = model.clone(true);
            wireframeModel.traverse((child) => {
                if (child.isMesh) {
                    child.material = wireframeMat.clone();
                }
            });
            wireframeModel.visible = false;
            scene.add(wireframeModel);

            // Stats
            let totalFaces = 0;
            let totalVertices = 0;
            model.traverse((child) => {
                if (child.isMesh && child.geometry) {
                    const geo = child.geometry;
                    totalFaces += geo.index ? geo.index.count / 3 : geo.attributes.position.count / 3;
                    totalVertices += geo.attributes.position.count;
                }
            });
            document.getElementById('stats').innerHTML = 
                `Actual mesh: ${Math.round(totalFaces).toLocaleString()} triangles, ${totalVertices.toLocaleString()} vertices`;
        });

        // Grid
        const grid = new THREE.GridHelper(10, 20, 0x333366, 0x222244);
        scene.add(grid);

        // Mode switching
        window.setMode = function(mode) {
            currentMode = mode;
            document.querySelectorAll('.controls:first-of-type button').forEach(b => b.classList.remove('active'));
            
            if (mode === 'solid') {
                document.getElementById('btnSolid').classList.add('active');
                if (model) { model.visible = true; model.traverse(c => { if(c.isMesh) c.material = materials[currentMaterial].clone(); }); }
                if (wireframeModel) wireframeModel.visible = false;
            } else if (mode === 'wireframe') {
                document.getElementById('btnWire').classList.add('active');
                if (model) model.visible = false;
                if (wireframeModel) { wireframeModel.visible = true; wireframeModel.traverse(c => { if(c.isMesh) { c.material = wireframeMat.clone(); c.material.opacity = 0.6; }}); }
            } else if (mode === 'both') {
                document.getElementById('btnBoth').classList.add('active');
                if (model) { model.visible = true; model.traverse(c => { if(c.isMesh) c.material = materials[currentMaterial].clone(); }); }
                if (wireframeModel) { wireframeModel.visible = true; wireframeModel.traverse(c => { if(c.isMesh) { c.material = wireframeMat.clone(); c.material.opacity = 0.15; }}); }
            } else if (mode === 'flat') {
                document.getElementById('btnFlat').classList.add('active');
                if (model) { model.visible = true; model.traverse(c => { if(c.isMesh) c.material = flatMat.clone(); }); }
                if (wireframeModel) wireframeModel.visible = false;
            }
        };

        window.setMaterial = function(mat) {
            currentMaterial = mat;
            document.querySelectorAll('.controls:nth-of-type(2) button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn' + mat.charAt(0).toUpperCase() + mat.slice(1)).classList.add('active');
            if (currentMode === 'solid' || currentMode === 'both') {
                if (model) model.traverse(c => { if(c.isMesh) c.material = materials[mat].clone(); });
            }
        };

        // Animate
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
